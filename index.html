<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ark Coast — Independent Online Retailer</title>
  <meta name="description" content="Ark Coast is an independent online retailer serving customers across the United States. Our products are sold exclusively through our Amazon storefront.">
  <link rel="canonical" href="https://ark-coast.com/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0f2a3d">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Ark Coast">
  <meta property="og:title" content="Ark Coast — Independent Online Retailer">
  <meta property="og:description" content="Independent online retailer serving customers across the United States through Amazon.">
  <meta property="og:url" content="https://ark-coast.com/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f5f2ec;
      --card: #ffffff;
      --ink: #0f2a3d;
      --muted: #5b6b77;
      --accent: #1f6f82;
      --accent-ink: #ffffff;
      --line: #e4ded3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1c28;
        --card: #11293a;
        --ink: #eef3f6;
        --muted: #9fb2bf;
        --accent: #5fb3c6;
        --accent-ink: #0b1c28;
        --line: #1f3a4d;
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--ink);
      font: 400 16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 520px;
      padding: 48px 40px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 1px 2px rgba(15, 42, 61, .04), 0 12px 32px rgba(15, 42, 61, .06);
    }

    .mark { width: 56px; height: 56px; display: block; margin: 0 auto 20px; }
    .mark rect { fill: var(--ink); }
    .mark path { stroke: var(--card); }

    h1 {
      margin: 0;
      font: 600 2.5rem/1.1 Fraunces, Georgia, serif;
      letter-spacing: -.01em;
    }
    .tagline {
      margin: 8px 0 24px;
      color: var(--accent);
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .about { margin: 0 0 32px; color: var(--muted); }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: var(--accent);
      color: var(--accent-ink);
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
      transition: transform .15s ease, filter .15s ease;
    }
    .cta:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .cta:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

    .contact {
      margin: 32px 0 0;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      font-size: .9rem;
      color: var(--muted);
    }
    .contact a { color: var(--ink); font-weight: 500; text-underline-offset: 3px; }

    footer { margin-top: 24px; font-size: .8rem; color: var(--muted); }

    @media (max-width: 480px) {
      main { padding: 40px 24px; }
      h1 { font-size: 2.1rem; }
    }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="8"/>
      <path d="M7 13q4.5-4 9 0t9 0M7 20q4.5-4 9 0t9 0" fill="none" stroke-width="2.4" stroke-linecap="round"/>
    </svg>

    <h1>Ark Coast</h1>
    <p class="tagline">Independent Online Retailer</p>
    <p class="about">
      Ark Coast is an independent online retailer serving customers across the United States.
      Our products are sold exclusively through our Amazon storefront.
    </p>

    <a class="cta" href="https://www.amazon.com/s?me=A1RWASBZTIAHI1&amp;marketplaceID=ATVPDKIKX0DER" rel="noopener">
      Visit our Amazon store <span aria-hidden="true">→</span>
    </a>

    <p class="contact">
      Supplier &amp; business inquiries<br>
      <a href="mailto:arkcoast@gmail.com">arkcoast@gmail.com</a>
    </p>
  </main>

  <footer>© <span id="year">2026</span> Ark Coast</footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
